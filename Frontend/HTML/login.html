<!DOCTYPE html> 
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RodaVía | Iniciar sesión</title>
  <link href="../../SRC/IMG/favicom/website_icon_white.png" rel="website icon" type="png">
  <link href="../CSS/estilosLogin_y_Registro.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/ScrollTrigger.min.js"></script>
</head>

<body>
  <div class="login-wrapper">
    <!-- Imagen izquierda -->
    <div class="login-image"></div>

    <!-- Formulario derecha -->
    <div class="login-container">
      <div class="login-content">
        <img src="../../SRC/IMG/logoRodaVía-removebg-preview.png" alt="Logo RodaVía" class="login-logo">

        <p class="subtitle">Alquila tu auto ideal en minutos</p>

        <div class="form-wrapper">
          <form id="loginForm">
            <input type="email" id="email" placeholder="Correo electrónico" required />
            <input type="password" id="password" placeholder="Contraseña" required />
            <button type="submit">Iniciar Sesión</button>
          </form>
        </div>

        <div id="errorMessage"></div>

        <div class="links">
          <a href="#">¿Olvidaste tu contraseña?</a>
          <a href="../HTML/registro.html">Crear cuenta</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../JS/login.js"></script>
</body>

</html>
